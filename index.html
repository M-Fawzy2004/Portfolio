<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Mohamed Fawzy | Flutter Developer</title>

  <!-- SEO -->
  <meta name="description"
    content="Portfolio of Mohamed Fawzy, Flutter Developer specializing in mobile apps and clean architecture." />

  <!-- Open Graph -->
  <meta property="og:title" content="Mohamed Fawzy | Flutter Developer" />
  <meta property="og:description" content="Portfolio showcasing my Flutter projects, skills, and experience." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://portfolio-mofawzy.vercel.app/" />
  <meta property="og:image" content="https://portfolio-mofawzy.vercel.app/preview.png" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Mohamed Fawzy | Flutter Developer" />
  <meta name="twitter:description" content="Portfolio showcasing my Flutter projects, skills, and experience." />
  <meta name="twitter:image" content="https://portfolio-mofawzy.vercel.app/preview.png" />

  <style>
    #loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0c0c10;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #loader .spinner {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.06);
      border-top-color: #38bdf8;
      animation: loader-spin 0.8s linear infinite;
    }

    #loader p {
      margin-top: 1.25rem;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.8125rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: #6b6b78;
    }

    @keyframes loader-spin {
      to {
        transform: rotate(360deg);
      }
    }

    [data-theme="light"] #loader {
      background: #f4f5f8;
    }

    [data-theme="light"] #loader .spinner {
      border-color: rgba(0, 0, 0, 0.08);
      border-top-color: #38bdf8;
    }

    [data-theme="light"] #loader p {
      color: #6b7280;
    }
  </style>
</head>

<body>
  <div id="root">
    <div id="loader">
      <div class="spinner"></div>
      <p>Loading</p>
    </div>
  </div>

  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
